[project]
name = "skills"
version = "0.0.0"
description = "エージェント向けプラグインとスキル"
# フックは利用者の python3 で直接動くので、macOS 標準の 3.9 でも動く範囲で書く。
requires-python = ">=3.9"
dependencies = []

[dependency-groups]
dev = [
  "basedpyright",
  "mypy",
  "pytest",
  "pytest-cov",
  "ruff",
]
# semgrep の依存はまだ新しい Python 向けのビルド済みパッケージがないので、別のグループに分けて 3.13 で動かす。
# 実行: uv run --python 3.13 --only-group semgrep semgrep scan ...
semgrep = [
  "semgrep; python_version >= '3.10' and python_version < '3.14'",
]

[tool.uv]
package = false
default-groups = ["dev"]

# --- ruff: すべてのルールを有効にし、衝突するものと理由のあるものだけを外す ---
[tool.ruff]
target-version = "py39"
line-length = 120
extend-exclude = [
  # 上流（nanaism/yomiyasu）の写し。手を加えないので検査しない。
  "plugins/ja-writing/skills/yomiyasu",
]

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
  "missing-trailing-comma", # フォーマッタと衝突する
  "missing-copyright-notice", # ファイルごとの著作権表示は置かない
  "incorrect-blank-line-before-class",   # D211 と衝突する
  "multi-line-summary-second-line",   # D212 と衝突する
]

[tool.ruff.lint.per-file-ignores]
# scripts/ と tools/ はパッケージではなく、直接実行するスクリプト
"plugins/**/scripts/*.py" = ["implicit-namespace-package"]
"tools/*.py" = ["implicit-namespace-package"]
"tests/**/*.py" = [
  "implicit-namespace-package",
  "magic-value-comparison", # テストの期待値はそのまま書く
  "assert", # pytest の assert
  # テストは名前で意図を書く。docstring は付けない。
  "undocumented-public-class",
  "undocumented-public-method",
  "undocumented-public-function",
  "no-self-use", # pytest のテストクラスはテストをまとめるだけで self を使わない
]

[tool.ruff.lint.isort]
# スクリプトとテストの共通部品は pythonpath に入れて import する。
known-first-party = ["textlint_runner", "post_edit", "stop", "session_start", "lint", "vendor_yomiyasu", "support"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
preview = true

# --- mypy: strict に加えて、任意のチェックもすべて有効にする ---
[tool.mypy]
# mypy は 3.9 を検査対象にできないので 3.10 で検査する。3.9 の文法は ruff(target-version)と basedpyright で確かめる。
python_version = "3.10"
strict = true
warn_unreachable = true
disallow_any_explicit = true
disallow_any_decorated = true
disallow_any_unimported = true
strict_bytes = true
local_partial_types = true
extra_checks = true
enable_error_code = [
  "deprecated",
  "exhaustive-match",
  "explicit-override",
  "ignore-without-code",
  "mutable-override",
  "possibly-undefined",
  "redundant-expr",
  "redundant-self",
  "truthy-bool",
  "truthy-iterable",
  "unimported-reveal",
  "unused-awaitable",
  "unused-ignore",
]
mypy_path = ["plugins/ja-writing/skills/textlint/scripts", "tools", "tests"]
files = ["plugins/ja-writing/skills/textlint/scripts", "tools", "tests"]
explicit_package_bases = true

# --- basedpyright: すべてのルールを有効にする ---
[tool.basedpyright]
pythonVersion = "3.9"
typeCheckingMode = "all"
include = ["plugins/ja-writing/skills/textlint/scripts", "tools", "tests"]
extraPaths = ["plugins/ja-writing/skills/textlint/scripts", "tools", "tests"]
reportImplicitStringConcatenation = false # ruff のフォーマッタと衝突する

# --- pytest: 警告と設定の誤りはエラーにし、分岐カバレッジ 100% を求める ---
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["plugins/ja-writing/skills/textlint/scripts", "tools", "tests"]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--import-mode=importlib",
  "--cov",
  "--cov-report=term-missing:skip-covered",
]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["plugins/ja-writing/skills/textlint/scripts", "tools"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = ['if __name__ == "__main__":']
