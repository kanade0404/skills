# PR のチェックをまとめて 1 つの必須チェック automerge-gate/all-passed にする。
# リポジトリは公開で、フォークからの PR の GITHUB_TOKEN は読み取りだけになるので public モードを使う。
# public モードでは、このジョブの name がそのまま必須チェックの名前になる。
name: automerge-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, auto_merge_enabled]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: automerge-gate/all-passed # ruleset の必須チェックの名前と一致させる
    runs-on: ubuntu-latest
    # アクションにはタイムアウトの入力がなく、待つ上限はこの値だけで決まる。
    timeout-minutes: 15
    permissions:
      checks: read
      pull-requests: read
      actions: read
    steps:
      - uses: pkgdeps/automerge-gate@9ab7a1d211aca48667cdbf94cca05ae67b64eba2 # v5.0.5
        with:
          gate-mode: public
          # CodeRabbit のチェックは除く。skipped と neutral は通るので CodeRabbit がレビューしたかの判定にならず、
          # 待つのはレビュー中の数分だけになる。レビューの確認は productivity の coderabbit-review-gate が受け持つ。
          # claude.yml はコメントで動く対話用のジョブで、コミットの検査ではない。
          ignore-checks: |
            [
              { "app": "coderabbitai" },
              { "workflow": "claude.yml" },
            ]
