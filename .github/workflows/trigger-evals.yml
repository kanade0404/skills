name: trigger-evals

on:
  pull_request:
    paths:
      - "skills/**"
  workflow_dispatch:

jobs:
  score-trigger-evals:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Score trigger evals
        run: python3 .github/scripts/check_trigger_evals.py
