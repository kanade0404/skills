name: consumer update

# kanade0404/skills の最新リリースタグへ consumer リポジトリの pin を追随させる
# reusable workflow (pull 型)。consumer 側の caller が schedule / workflow_dispatch
# で呼び出し、`update_command` (caller が自リポの流儀で書く) が pin 書き換えと
# 生成物の再生成まで行う。差分が出れば `chore/skills-<tag>` ブランチで PR を作る。
# merge はしない (人間ゲート)。
#
# caller 側の要件:
#   - permissions: contents: write / pull-requests: write を明示する
#     (reusable workflow は caller token の権限を downgrade しかできない)
#   - repo 設定 "Allow GitHub Actions to create and approve pull requests" を有効化
#   - GITHUB_TOKEN で作成した PR は他 workflow (CI) をトリガしない。PR 上で CI を
#     回したい場合は secrets.pr_token に fine-grained PAT (contents / pull-requests:
#     write) を渡す
#
# 冪等性: 同じタグの更新 PR が既に存在すれば (open / merged / closed を問わず)
# 何もしない (日次 schedule で多重 PR にならず、merge 後の branch 削除忘れや
# 意図的な close も蒸し返さない)。ブランチだけが残っている場合 (前回 push 後の
# PR 作成失敗 = 孤児ブランチ) は、そのブランチから PR 作成を再試行して自動復旧
# する。pin が既に最新なら差分ゼロで終了する。

on:
  workflow_call:
    inputs:
      update_command:
        description: >-
          最新タグを環境変数 SKILLS_TAG で受け取り、pin の書き換えから生成物の
          再生成までを行うコマンド (multi-line 可)。caller リポジトリの信頼済み
          設定として実行される。
        required: true
        type: string
      source_repo:
        description: リリースタグの取得元リポジトリ
        required: false
        type: string
        default: kanade0404/skills
    secrets:
      pr_token:
        description: >-
          checkout / push / PR 作成に使う PAT。省略時は GITHUB_TOKEN
          (その場合、作成された PR 上で CI はトリガされない)。
        required: false

jobs:
  update:
    runs-on: ubuntu-latest
    # schedule と workflow_dispatch の同時実行でタグ解決〜push が競合しないよう
    # consumer リポジトリ単位で直列化する (後発は cancel せず待たせる —
    # 先発が PR を作れば後発は open-PR ガードで no-op になる)
    concurrency:
      group: skills-consumer-update-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.pr_token || github.token }}
          # workflow_dispatch が非デフォルトブランチから起動されても、更新は常に
          # デフォルトブランチ基点で行う (トリガ ref 基点だと無関係な commit が
          # 更新 PR に混入する)
          ref: ${{ github.event.repository.default_branch }}

      - name: Resolve latest release tag
        id: tag
        env:
          SOURCE_REPO: ${{ inputs.source_repo }}
        run: |
          set -euo pipefail
          # semver 形式のタグだけを候補にする (非 semver タグの排除と同時に、
          # ブランチ名・コマンドへ渡る値の charset を固定する)
          tag=$(git ls-remote --tags --refs "https://github.com/${SOURCE_REPO}.git" 'v*' \
            | awk -F/ '{print $NF}' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -1) || true
          if [ -z "$tag" ]; then
            echo "::error::no vX.Y.Z tag found in ${SOURCE_REPO}"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check existing branch and PR for this tag
        id: guard
        env:
          GH_TOKEN: ${{ secrets.pr_token || github.token }}
          BRANCH: chore/skills-${{ steps.tag.outputs.tag }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # skip 判定は「PR の有無」で行う。ブランチ存在だけで skip すると、
          # 前回 push 後に PR 作成が失敗した場合 (Actions の PR 作成許可が無効、
          # 一時エラー等) に孤児ブランチが残って永久に復旧不能になる
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            echo "branch_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "branch_exists=false" >> "$GITHUB_OUTPUT"
          fi
          # state 問わず数える: merged / closed も「この tag は処理済み」扱いにする
          # (branch 削除忘れで merge 済みブランチから毎日 PR 再作成を試みない /
          # 意図的に close された tag を蒸し返さない)。fork の同名 branch による
          # PR は除外する (公開リポで guard を偽装して更新 PR を止められないよう、
          # head リポジトリのオーナーがこのリポジトリと一致するものだけ数える)
          prs=$(gh pr list --head "$BRANCH" --state all --json headRepositoryOwner \
            | jq --arg owner "$OWNER" \
                '[.[] | select(.headRepositoryOwner.login == $owner)] | length')
          if [ "$prs" -gt 0 ]; then
            echo "a PR for $BRANCH already exists (any state); nothing to do"
            echo "pr_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "pr_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run update command
        if: steps.guard.outputs.pr_exists == 'false' && steps.guard.outputs.branch_exists == 'false'
        env:
          SKILLS_TAG: ${{ steps.tag.outputs.tag }}
          # update_command 内の GitHub API を叩くツール (rulesync fetch 等) が
          # 匿名レート制限 (60 req/h) に当たらないよう token を渡す。
          # 実障害: rulesync fetch が runner の匿名クォータで 403 になった
          GITHUB_TOKEN: ${{ secrets.pr_token || github.token }}
          GH_TOKEN: ${{ secrets.pr_token || github.token }}
        run: ${{ inputs.update_command }}

      - name: Create pull request if changed
        if: steps.guard.outputs.pr_exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.pr_token || github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          SOURCE_REPO: ${{ inputs.source_repo }}
          BRANCH_EXISTS: ${{ steps.guard.outputs.branch_exists }}
        run: |
          set -euo pipefail
          branch="chore/skills-${TAG}"
          if [ "$BRANCH_EXISTS" = "true" ]; then
            # 孤児ブランチ: 前回 run が push まで成功して PR 作成に失敗した状態。
            # commit はそのまま使い、PR 作成だけを再試行する
            echo "reusing orphaned branch $branch from a previous run"
          else
            if [ -z "$(git status --porcelain)" ]; then
              echo "already up to date (${TAG})"
              exit 0
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git switch -c "$branch"
            git add -A
            git commit -m "Update ${SOURCE_REPO} pin to ${TAG}"
            git push origin "$branch"
          fi
          {
            printf 'Update rulesync pin to [`%s`](https://github.com/%s/releases/tag/%s).\n\n' "$TAG" "$SOURCE_REPO" "$TAG"
            printf 'Generated outputs were regenerated by this repository'"'"'s own update command.\n'
            printf 'Tags: https://github.com/%s/tags\n' "$SOURCE_REPO"
          } > /tmp/pr-body.md
          gh pr create \
            --title "Update ${SOURCE_REPO} pin to ${TAG}" \
            --body-file /tmp/pr-body.md \
            --head "$branch"
